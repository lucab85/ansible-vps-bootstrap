services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [apps]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [apps]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [apps]
    depends_on:
      - n8n
      - grafana
      - puntofeste-backend
      - smoothclothingbrand-backend
      - postiz

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: ${WEBHOOK_URL}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      N8N_METRICS: "true"
      N8N_METRICS_INCLUDE_DEFAULT_METRICS: "true"
      N8N_METRICS_INCLUDE_QUEUE_METRICS: "true"
      # n8n blocks {{ $env.X }} in node expressions by default (security
      # default for multi-tenant instances) — several workflows here rely
      # on it (GITHUB_TOKEN, CLAUDE_BRIDGE_KEY, etc.), and this is a
      # single-owner instance, so it's safe to allow.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Read via {{ $env.X }} inside specific workflow nodes (HTTP Request
      # headers), not n8n credential objects — see lucab85/n8n-workflows.
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      CONVERTKIT_API_SECRET: ${CONVERTKIT_API_SECRET}
      APIFY_TOKEN: ${APIFY_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CLAUDE_BRIDGE_KEY: ${CLAUDE_BRIDGE_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [apps]
    depends_on:
      postgres:
        condition: service_healthy

  claude-bridge:
    build:
      context: ./claude-bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BRIDGE_KEY: ${CLAUDE_BRIDGE_KEY}
      CLAUDE_TIMEOUT: "300"
      CLAUDE_CONCURRENCY: "1"
    volumes:
      # Same OAuth session as the interactive Claude Code session on this
      # host, mounted read-only — the bridge shares its usage quota, it
      # doesn't have a separate identity. --no-session-persistence in the
      # bridge's invocation means it never needs to write here.
      #
      # Mount the whole ~/.claude directory, not individual files inside
      # it (credentials.json, settings.json) — a single-file bind mount
      # pins the container to the inode that existed at mount/start time.
      # The host's OAuth refresh replaces .credentials.json atomically
      # (unlink+rename), which is invisible to a single-file bind mount:
      # the container keeps reading the old, now-dead token forever and
      # the CLI reports "OAuth access token has been revoked" even though
      # the host's real session is fine. A directory-level bind mount
      # doesn't have this problem — a replaced file inside it is visible
      # immediately. (Diagnosed by diffing the container's and host's
      # .credentials.json byte-for-byte: different tokens, different
      # expiresAt — confirmed fixed by restarting the container so it
      # re-resolves the mount, then made permanent with this change.)
      - /home/deploy/.claude.json:/root/.claude.json:ro
      - /home/deploy/.claude:/root/.claude:ro
    networks: [apps]

  # Postiz's job-scheduling backend. Upstream's own docker-compose pairs this
  # with a dedicated Elasticsearch + Temporal-Postgres + Temporal-UI +
  # admin-tools stack (~1.5-2GB+ RAM) - all skipped here. DYNAMIC_CONFIG_FILE_
  # PATH=development-sql.yaml is the same file upstream's compose already
  # uses; Elasticsearch there is a pure opt-in (ENABLE_ES=true + ES_SEEDS),
  # not a requirement - omitting it just means standard (SQL-based) visibility
  # instead of advanced/search visibility, which is all Postiz's own internal
  # scheduling needs (confirmed against Temporal's own official ES-free
  # docker-compose-postgres.yml sample, which uses this identical config).
  # Reuses this host's shared Postgres (own appuser has CREATEDB - Temporal's
  # auto-setup creates its own `temporal`/`temporal_visibility` databases
  # there on first boot) instead of a dedicated Postgres container.
  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      # Not baked into the temporalio/auto-setup image itself - both
      # upstream's own docker-compose sample and Postiz's compose mount this
      # exact file in from outside. Fetched verbatim from
      # temporalio/docker-compose's dynamicconfig/development-sql.yaml.
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks: [apps]
    depends_on:
      postgres:
        condition: service_healthy

  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    restart: unless-stopped
    environment:
      MAIN_URL: https://postiz.lucaberton.com
      FRONTEND_URL: https://postiz.lucaberton.com
      NEXT_PUBLIC_BACKEND_URL: https://postiz.lucaberton.com/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      JWT_SECRET: ${POSTIZ_JWT_SECRET}
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postiz"
      REDIS_URL: "redis://redis:6379/3"
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: "true"
      # Registration is open until the first (your) account exists - flip
      # this to "true" right after, so the public URL can't be used to
      # create unrelated accounts.
      DISABLE_REGISTRATION: "false"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
    volumes:
      - postiz_config:/config/
      - postiz_uploads:/uploads/
    networks: [apps]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started

  medusa:
    build:
      context: ./medusa
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./medusa/.env
    networks: [apps]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  puntofeste-backend:
    image: node:20
    restart: unless-stopped
    working_dir: /app
    volumes:
      - /opt/apps/puntofeste/apps/backend:/app
    # Production build, not `medusa develop` - dev mode forks a second node
    # process for the actual server on top of the supervisor/watcher one,
    # roughly doubling RSS, and its file-watcher/HMR state was the single
    # biggest source of swapped-out memory on this host. NODE_ENV=production
    # must NOT be set during npm install/build - npm skips devDependencies
    # (ts-node, @swc/core) under NODE_ENV=production, which breaks loading
    # medusa-config.ts (verified in an isolated /tmp copy, completely
    # separate from this bind mount, before ever touching this container).
    # medusa build's output lives in .medusa/server with its own
    # package.json - migrations and start run from there per Medusa's own
    # production docs, not from the project root.
    command: sh -c "npm install && npx medusa build && rm -rf node_modules && cd .medusa/server && npm install && npx medusa db:migrate && npx medusa db:sync-links && NODE_ENV=production npx medusa start"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/puntofeste"
      REDIS_URL: "redis://redis:6379/1"
      STORE_CORS: ${PUNTOFESTE_STOREFRONT_URL}
      ADMIN_CORS: ${PUNTOFESTE_BACKEND_URL}
      AUTH_CORS: "${PUNTOFESTE_STOREFRONT_URL},${PUNTOFESTE_BACKEND_URL}"
      JWT_SECRET: ${PUNTOFESTE_JWT_SECRET}
      COOKIE_SECRET: ${PUNTOFESTE_COOKIE_SECRET}
      MEDUSA_BACKEND_URL: ${PUNTOFESTE_BACKEND_URL}
      __MEDUSA_ADMIN_ADDITIONAL_ALLOWED_HOSTS: admin-puntofeste.techmeout.it
    networks: [apps]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  smoothclothingbrand-backend:
    image: node:20
    restart: unless-stopped
    working_dir: /app
    volumes:
      - /opt/apps/smoothclothingbrand/apps/backend:/app
    # Same production-build fix as puntofeste-backend above - see that
    # service's comment for the full rationale (dev-mode's forked child
    # process + watcher state was the biggest source of swapped memory on
    # this host, NODE_ENV=production must stay off npm install/build or it
    # strips devDependencies needed to load medusa-config.ts, and migrations
    # run from .medusa/server per Medusa's production docs). Verified in an
    # isolated /tmp copy end to end (build, db:migrate, db:sync-links against
    # the real DB, and a real medusa start serving 200s) before applying here.
    command: sh -c "npm install && npx medusa build && rm -rf node_modules && cd .medusa/server && npm install && npx medusa db:migrate && npx medusa db:sync-links && NODE_ENV=production npx medusa start"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/smoothclothingbrand"
      REDIS_URL: "redis://redis:6379/2"
      STORE_CORS: ${SMOOTHCLOTHINGBRAND_STOREFRONT_URL}
      ADMIN_CORS: ${SMOOTHCLOTHINGBRAND_BACKEND_URL}
      AUTH_CORS: "${SMOOTHCLOTHINGBRAND_STOREFRONT_URL},${SMOOTHCLOTHINGBRAND_BACKEND_URL}"
      JWT_SECRET: ${SMOOTHCLOTHINGBRAND_JWT_SECRET}
      COOKIE_SECRET: ${SMOOTHCLOTHINGBRAND_COOKIE_SECRET}
      MEDUSA_BACKEND_URL: ${SMOOTHCLOTHINGBRAND_BACKEND_URL}
      __MEDUSA_ADMIN_ADDITIONAL_ALLOWED_HOSTS: admin-smoothclothingbrand.techmeout.it
    networks: [apps]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ./monitoring/textfile_collector:/textfile_collector:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.textfile.directory=/textfile_collector"
    networks: [apps]

  # Per-*container* CPU/memory/network - none of the other exporters cover
  # this (node-exporter is host-level only, postgres/redis-exporter are
  # single-service). Without this, most of what's actually running (postiz,
  # temporal, both Medusa backends, medusa, claude-bridge) has zero
  # monitoring at all. Doesn't need --privileged on Ubuntu/cgroup v2 (only
  # RHEL/CentOS require that, per cAdvisor's own docs) - the read-only
  # mounts below are enough.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    command:
      # Default config walks every container's full filesystem (inode-by-
      # inode disk usage) every 10s - measured live at 1.2GB RAM and ~92%
      # CPU sustained on this host, thrashing specifically on the two
      # Medusa backends' node_modules trees (hundreds of thousands of small
      # files). `disk` is that expensive per-container walk; everything
      # else it collects (cpu, memory, network) is what we actually want
      # and is cheap. 60s housekeeping instead of the 10s default since
      # nothing here needs second-by-second resolution.
      - "--disable_metrics=disk,diskIO,percpu,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl,tcp,udp"
      - "--housekeeping_interval=60s"
      - "--docker_only=true"
      - "--store_container_labels=false"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [apps]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres_exporter:${POSTGRES_EXPORTER_PASSWORD}@postgres:5432/postgres?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    volumes:
      - ./monitoring/postgres-exporter/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    networks: [apps]
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    networks: [apps]
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    networks: [apps]

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks: [apps]

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks: [apps]
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [apps]
    depends_on:
      - prometheus
      - loki

networks:
  apps:

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  n8n_data:
  prometheus_data:
  loki_data:
  grafana_data:
  postiz_config:
  postiz_uploads:
